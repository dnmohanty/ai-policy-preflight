[project]
name = "ai-policy-preflight"
version = "0.1.0"
description = "A local deterministic firewall for AI coding agents."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0.1",
]

[project.scripts]
ai-preflight = "preflight.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["preflight"]