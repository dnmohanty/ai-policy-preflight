name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest ruff
          
      - name: Lint with ruff
        run: ruff check preflight/ tests/
        
      - name: Run unit tests
        run: pytest
        
      - name: Verify schema is up to date
        run: |
          python export_schema.py
          git diff --exit-code policy.schema.json || (echo "policy.schema.json is out of date. Run export_schema.py and commit the changes." && exit 1)