version: 1
default_decision: allow
normalizers:
  - nfkc
  - collapse_whitespace
  - strip_shell_quotes
  - decode_base64
rules:
  - id: secrets-entropy
    applies_to: [shell, write, prompt]
    match:
      kind: entropy
      field: body
      threshold: 4.2
      min_length: 32
    decision: warn
    message: "High entropy string detected (possible secret)."

  - id: aws-key
    applies_to: [shell, write, prompt]
    match:
      kind: regex
      field: body
      pattern: 'AKIA[0-9A-Z]{16}'
    decision: deny
    message: "AWS Access Key detected."
    
  - id: private-key-header
    applies_to: [shell, write, prompt]
    match:
      kind: regex
      field: body
      pattern: '-----BEGIN (?:[A-Z]+ )*PRIVATE KEY-----\s*[A-Za-z0-9+/=]{16,}'
    decision: deny
    message: "Private key material detected."

  - id: api-key-prefixes
    applies_to: [shell, write, prompt]
    match:
      kind: regex
      field: body
      pattern: '\bgh[pousr]_[A-Za-z0-9]{30,}|\bgithub_pat_[A-Za-z0-9_]{22,}|\bsk-(?:proj-|ant-)?[A-Za-z0-9_\-]{20,}|\bxox[abprs]-[A-Za-z0-9-]{10,}'
    decision: deny
    message: "Looks like an API token (GitHub, OpenAI/Anthropic-style, Slack)."
  - id: protect-env
    applies_to: [write]
    match:
      kind: regex
      field: path
      pattern: '(?i)(?:^|[\\/])\.env(?:\.(?!(?:example|sample|template)$)[^\\/]*)?$'
    decision: deny
    message: "Writing to .env files is blocked (.env.example/.sample/.template are allowed)."
  - id: shell-write-env
    applies_to: [shell]
    match:
      kind: regex
      field: command
      pattern: '(?i)(?:>>?|\btee\b(?:\s+-a)?|\b(?:cp|mv|install)\b|\bsed\s+-i\S*|\bdd\b[^|;&\n]*\bof=)[^|;&\n]*(?:^|[\s/=])\.env(?:\.(?!(?:example|sample|template)(?:\s|$|[;&|]))\w+)?(?=\s|$|[;&|])'
    decision: deny
    message: "Shell command writes to a .env file."
  - id: protect-github-workflows
    applies_to: [write]
    match:
      kind: glob
      field: path
      pattern: '.github/workflows/*'
    decision: deny
    message: "Modifying CI workflows is blocked."

  - id: protect-ssh-dir
    applies_to: [write]
    match:
      kind: glob
      field: path
      pattern: '.ssh/*'
    decision: deny
    message: "Writing to .ssh directory is blocked."

  - id: shell-write-ssh
    applies_to: [shell]
    match:
      kind: regex
      field: command
      pattern: '(?:>>?|\btee\b|\b(?:cp|mv|install)\b|\bsed\s+-i\S*)[^|;&\n]*\.ssh/'
    decision: deny
    message: "Shell command writes into a .ssh directory."
  - id: protect-pem-keys
    applies_to: [write]
    match:
      kind: glob
      field: path
      pattern: '*.pem'
    decision: deny
    message: "Writing .pem keys is blocked."

  - id: protect-id-rsa
    applies_to: [write]
    match:
      kind: glob
      field: path
      pattern: 'id_rsa*'
    decision: deny
    message: "Writing private keys is blocked."

  - id: warn-lockfiles-npm
    applies_to: [write]
    match:
      kind: glob
      field: path
      pattern: 'package-lock.json'
    decision: warn
    message: "Modifying package-lock.json. Verify dependencies."

  - id: warn-lockfiles-poetry
    applies_to: [write]
    match:
      kind: glob
      field: path
      pattern: 'poetry.lock'
    decision: warn
    message: "Modifying poetry.lock. Verify dependencies."

  - id: shell-rm-root
    applies_to: [shell]
    match:
      kind: regex
      field: command
      pattern: '\brm\b(?=[^|;&\n]*\s-[a-zA-Z]*[rR])[^|;&\n]*\s(?:/|/\*|~|~/|~/\*|\$HOME|/(?:etc|usr|bin|sbin|boot|home|var|lib|opt|root)/?)(?=\s|$|[;&|])'
    decision: deny
    message: "Destructive rm command blocked."

  - id: shell-curl-pipe
    applies_to: [shell]
    match:
      kind: regex
      field: command
      pattern: '\b(?:curl|wget)\b[^|;&\n]*\|\s*(?:sudo\s+)?(?:ba|z|da|k)?sh\b|\b(?:ba|z|da)?sh\s+-c\s+["'']?\$\(\s*(?:curl|wget)\b|<\(\s*(?:curl|wget)\b'
    decision: deny
    message: "Piping remote script to shell blocked."

  - id: shell-chmod-777
    applies_to: [shell]
    match:
      kind: regex
      field: command
      pattern: '\bchmod\s+(?:-R\s+)?777\b'
    decision: warn
    message: "Making files globally writable (777)."

  - id: shell-git-push-force
    applies_to: [shell]
    match:
      kind: regex
      field: command
      pattern: '\bgit\s+push\b[^|;&\n]*\s(?:--force(?![-\w])|-[a-zA-Z]*f[a-zA-Z]*(?=\s|$))'
    decision: warn
    message: "Force pushing to git repository."
  - id: network-allowlist
    applies_to: [shell]
    match:
      kind: domain_allowlist
      field: command
      allowed_domains:
        - github.com
        - api.github.com
        - files.pythonhosted.org
        - pypi.org
        - registry.npmjs.org
    decision: deny
    message: "Connection to unauthorized domain."